[package]
name = "wss"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "wss"
path = "src/main.rs"

[dependencies]
tokio = { version = "^1.45", features = ["macros", "sync", "rt-multi-thread"] }
tokio-stream = "^0.1.17"
warp = "^0.3.7"
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
futures = { version = "^0.3", default-features = false }
uuid = { version = "^1.16", features = ["serde", "v4"] }
chrono = { version = "^0.4.41", features = ["serde", "std", "clock"] }
sqlx = { version = "^0.8", features = [ "runtime-tokio", "mysql", "chrono" ] }